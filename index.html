<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wladmir Bonadio Filho | Advocacia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a0a2e 0%, #2d1b4e 30%, #1a0a2e 70%, #0f0618 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        
        .profile-photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin: 0 auto 24px;
            border: 3px solid #c9a553;
            box-shadow: 0 8px 32px rgba(201, 165, 83, 0.25), 0 0 60px rgba(201, 165, 83, 0.1);
            overflow: hidden;
            background: linear-gradient(135deg, #2d1b4e, #1a0a2e);
        }
        
        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        
        .title {
            font-size: 11px;
            font-weight: 500;
            color: #c9a553;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .title::before,
        .title::after {
            content: '';
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a553);
        }
        
        .title::after {
            background: linear-gradient(90deg, #c9a553, transparent);
        }
        
        .bio {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
            padding: 0 10px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }
        
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: rgba(201, 165, 83, 0.08);
            border: 1px solid rgba(201, 165, 83, 0.3);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 165, 83, 0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .link-btn:hover {
            background: rgba(201, 165, 83, 0.15);
            border-color: rgba(201, 165, 83, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(201, 165, 83, 0.2);
        }
        
        .link-btn:hover::before {
            left: 100%;
        }
        
        .link-btn.primary {
            background: linear-gradient(135deg, #c9a553, #d4af37);
            border: none;
            color: #1a0a2e;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(201, 165, 83, 0.3);
        }
        
        .link-btn.primary:hover {
            background: linear-gradient(135deg, #d4af37, #e8c45a);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(201, 165, 83, 0.4);
        }
        
        .link-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        
        .link-btn.primary .link-icon {
            color: #1a0a2e;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .social-link {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(201, 165, 83, 0.1);
            border: 1px solid rgba(201, 165, 83, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9a553;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            background: rgba(201, 165, 83, 0.2);
            border-color: #c9a553;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 165, 83, 0.2);
        }
        
        .social-link svg {
            width: 20px;
            height: 20px;
        }
        
        .footer {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        @media (max-width: 380px) {
            .name {
                font-size: 24px;
            }
            
            .link-btn {
                padding: 16px 20px;
                font-size: 14px;
            }
            
            .profile-photo {
                width: 120px;
                height: 120px;
            }
        }
    </style>

    <script>
    window.addEventListener('load', function() {

      // --- 1. UTM Pass-Through ---
      // Captura UTMs da URL atual (ex: links.bonadio.site?utm_source=instagram)
      // e injeta nos links que apontam para wladmirbonadio.com.br
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.toString()) {
        document.querySelectorAll('a').forEach(function(link) {
          if (link.href && link.href.includes('bonadio.site')) {
            try {
              var url = new URL(link.href);
              urlParams.forEach(function(value, key) {
                url.searchParams.set(key, value);
              });
              link.href = url.toString();
            } catch(e) {}
          }
        });
      }

      // --- 2. Click Tracking nos botões de link ---
      // Cada clique gera um evento no dataLayer (GTM lê) e no Meta Pixel
      document.querySelectorAll('.link-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var label = btn.textContent.trim().replace(/\s+/g, ' ');
          var dest  = btn.href || '';

          // Push para GTM / GA4
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event:      'link_bio_click',
            link_label: label,
            link_url:   dest
          });

          // Evento customizado no Meta Pixel (cria audiência "clicou mas não inscreveu")
          if (window.fbq) {
            fbq('trackCustom', 'LinkBioClick', { label: label, destination: dest });
          }
        });
      });

      // --- 3. Click Tracking nos links sociais ---
      document.querySelectorAll('.social-link').forEach(function(link) {
        link.addEventListener('click', function() {
          var label = link.getAttribute('aria-label') || 'Social';
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            event:       'link_bio_social_click',
            social_name: label,
            link_url:    link.href
          });
        });
      });

    });
    </script>
